name: weatherapp
description: "A modern Flutter Weather App using OpenWeatherMap API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  http: ^1.2.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  intl: ^0.19.0
  geolocator: ^11.1.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/