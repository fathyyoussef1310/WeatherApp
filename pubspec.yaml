name: weatherapp
description: "A modern Flutter Weather App using OpenWeatherMap API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  http: ^1.5.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  intl: ^0.19.0
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  flutter_bloc: ^9.1.1
  location: ^8.0.1
  google_maps_flutter: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Icons/Moon cloud mid rain.png"
  min_sdk_android: 28
  adaptive_icon_background: "#000000"
  web:
    generate: true
    image_path: "assets/Icons/Moon cloud mid rain.png"
    background_color: "#000000"
  windows:
    generate: true
    image_path: "assets/Icons/Moon cloud mid rain.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/Icons/Moon cloud mid rain.png"
